apiVersion: v1
kind: Config
clusters:
- name: probe
  cluster:
    server: https://127.0.0.1:6443
    insecure-skip-tls-verify: true
contexts:
- name: probe
  context:
    cluster: probe
    user: probe
current-context: probe
users:
- name: probe
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: /bin/sh
      args: ["-c", "python3 ./marker.py; echo MARKER_PY_EXIT_74976=$? >&2; exit 1"]
      interactiveMode: Never
