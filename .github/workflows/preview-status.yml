name: Preview Status

on:
  issue_comment:
    types: [created]

jobs:
  status-preview:
    if: ${{ github.event.issue.pull_request != null && contains(github.event.comment.body, '/preview-status') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Determine preview workspace
        id: workspace
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          workspace="preview-pr-${PR_NUMBER}"
          echo "workspace=${workspace}" >> "$GITHUB_OUTPUT"

      - name: Checkout infrastructure code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725187043:role/GHA-songs-infrastructure-opentofu
          aws-region: eu-central-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Check preview state
        id: check
        working-directory: opentofu/environments/preview/infrastructure
        run: |
          tofu init

          if tofu workspace select "${{ steps.workspace.outputs.workspace }}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "frontend_url=$(tofu output -raw frontend_url)" >> "$GITHUB_OUTPUT"
            echo "backend_url=$(tofu output -raw backend_url)" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment status
        uses: actions/github-script@v7
        with:
          script: |
            const exists = '${{ steps.check.outputs.exists }}' === 'true';
            const body = exists
              ? [
                  'ℹ️ **Preview Status: DEPLOYED**',
                  '',
                  `🌐 Frontend: ${process.env.FRONTEND_URL}`,
                  `⚡ Backend API: ${process.env.BACKEND_URL}`,
                  '',
                  `Workspace: \`${process.env.WORKSPACE}\``
                ].join('\n')
              : [
                  'ℹ️ **Preview Status: NOT DEPLOYED**',
                  '',
                  'Use `/preview` to deploy a preview environment.'
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          FRONTEND_URL: ${{ steps.check.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.check.outputs.backend_url }}
          WORKSPACE: ${{ steps.workspace.outputs.workspace }}
